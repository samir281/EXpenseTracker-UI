[build]
  command = "npm run build"
  publish = "dist"

# Serve the web manifest with the correct MIME type. Without this Netlify
# sends application/octet-stream, which Chrome ignores — so the app installs
# as a plain bookmark instead of a real PWA.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Never cache the service worker so new deploys are picked up immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
